name: meet-agent

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: meetagent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - meet_agent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meetagent"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/meetagent
      DATABASE_SSL: "false"
      DATABASE_POOL_SIZE: 10
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_CURATOR_MODEL: ${OPENAI_CURATOR_MODEL:-gpt-5.6-luna}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/auth/google/callback}
      OAUTH_TOKEN_ENCRYPTION_KEY: ${OAUTH_TOKEN_ENCRYPTION_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      ALLOW_LOCAL_IDENTITY: ${ALLOW_LOCAL_IDENTITY:-true}
      ALLOW_DEMO_IDENTITY: "false"
      LOCAL_WORKSPACE_ID: ${LOCAL_WORKSPACE_ID:-00000000-0000-0000-0000-000000000001}
      LOCAL_USER_ID: ${LOCAL_USER_ID:-00000000-0000-0000-0000-000000000002}
      LOCAL_USER_EMAIL: ${LOCAL_USER_EMAIL:-local@example.com}
      MEETING_INTERVENTION_BUDGET: ${MEETING_INTERVENTION_BUDGET:-4}
      CURATOR_POLL_INTERVAL_MS: ${CURATOR_POLL_INTERVAL_MS:-1500}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3000/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  meet_agent_postgres:
