<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meet Agent · Memory Observer</title>
  <style>
    :root{color-scheme:dark;--bg:#080b16;--glass:rgba(18,24,43,.62);--glass-strong:rgba(16,22,40,.82);--border:rgba(255,255,255,.1);--border-hi:rgba(255,255,255,.18);--text:#f4f6ff;--muted:#8f9ab8;--blue:#79a9ff;--cyan:#71e4e8;--green:#61e2b4;--amber:#f4bd73;--danger:#ff7e9d;--shadow:0 24px 70px rgba(0,0,0,.34)}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:radial-gradient(900px 600px at 7% -10%,rgba(82,105,255,.19),transparent 62%),radial-gradient(800px 650px at 100% 100%,rgba(21,195,174,.12),transparent 58%),var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,#000,transparent 75%)}
    .shell{height:100%;padding:16px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:14px}.glass{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.018) 38%),var(--glass);border:1px solid var(--border);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),var(--shadow);backdrop-filter:blur(24px) saturate(145%);-webkit-backdrop-filter:blur(24px) saturate(145%)}
    header{min-height:66px;border-radius:20px;display:flex;align-items:center;padding:10px 13px 10px 16px;gap:12px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand-mark{width:34px;height:34px;border-radius:12px;background:radial-gradient(circle at 30% 25%,#fff 0 3%,#9fe7ff 12%,#7087ff 38%,#6654e7 70%,#25234e 100%);box-shadow:0 0 28px rgba(103,130,255,.42),inset 0 1px 3px rgba(255,255,255,.8)}h1{font-size:14px;line-height:1.1;margin:0;font-weight:680;letter-spacing:.01em}.subtitle{font-size:11px;color:var(--muted);margin-top:4px}.header-actions{margin-left:auto;display:flex;align-items:center;gap:9px}.live{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:12px;color:#b9f7df;background:rgba(51,210,157,.08);border:1px solid rgba(97,226,180,.16);font-size:11px;font-weight:650}.live:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}select,.search{height:34px;border-radius:12px;border:1px solid var(--border);background:rgba(5,9,20,.42);color:var(--text);outline:none;padding:0 11px;font:inherit;font-size:12px}select:focus,.search:focus{border-color:rgba(121,169,255,.5);box-shadow:0 0 0 3px rgba(121,169,255,.08)}
    main{min-height:0;display:grid;grid-template-columns:minmax(0,1.58fr) minmax(330px,.62fr);gap:14px}.panel{min-height:0;border-radius:22px;overflow:hidden}.panel-head{height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.07)}.panel-head h2{margin:0;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#c5cce2;font-weight:700}.count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}.graph-panel{display:grid;grid-template-rows:56px minmax(0,1fr)}.graph-tools{margin-left:auto;display:flex;align-items:center;gap:7px}.search{width:190px}.icon-btn{width:31px;height:31px;display:grid;place-items:center;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.035);color:#c7d1ef;cursor:pointer;font-size:16px}.icon-btn:hover{background:rgba(255,255,255,.09);border-color:var(--border-hi)}
    .graph-wrap{position:relative;min-height:0;overflow:hidden}.graph-wrap:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 30%,rgba(5,8,18,.14) 100%)}#graph{width:100%;height:100%;display:block;touch-action:none;cursor:grab}#graph.dragging{cursor:grabbing}.edge{stroke:#a8b9df;stroke-opacity:.52;stroke-width:1.1;vector-effect:non-scaling-stroke}.edge.connected{stroke:var(--blue);stroke-opacity:.92;stroke-width:1.8}.edge-label{fill:#bbc7e6;font-size:9px;text-anchor:middle;paint-order:stroke;stroke:#0b1020;stroke-width:3px;display:none}.edge-label.visible{display:block}.node-group{cursor:pointer}.node-halo{fill:transparent;stroke:transparent;stroke-width:8}.node{stroke-width:1.5;vector-effect:non-scaling-stroke;transition:r .16s ease,opacity .16s ease;filter:drop-shadow(0 2px 9px rgba(0,0,0,.48))}.node.active{fill:var(--green);stroke:#d1ffeb}.node.confirmed{fill:var(--blue);stroke:#e2edff}.node.superseded{fill:var(--amber);stroke:#ffebd0;opacity:.82}.node-group:hover .node,.node-group.selected .node{r:16}.node-group.dim{opacity:.11}.node-label{display:none;fill:#f4f6ff;font-size:10px;font-weight:600;text-anchor:middle;paint-order:stroke;stroke:#080b16;stroke-width:4px;stroke-linejoin:round;pointer-events:none}.node-group:hover .node-label,.node-group.selected .node-label{display:block}.legend{position:absolute;left:14px;bottom:14px;z-index:1;display:flex;gap:12px;padding:8px 11px;border-radius:13px;background:rgba(9,13,26,.56);border:1px solid var(--border);backdrop-filter:blur(14px);font-size:10px;color:var(--muted)}.legend span{display:flex;align-items:center;gap:5px}.dot{width:6px;height:6px;border-radius:50%}.hint{position:absolute;right:14px;bottom:14px;z-index:1;color:rgba(180,191,220,.58);font-size:10px}
    aside{min-height:0;display:grid;grid-template-rows:minmax(230px,.9fr) minmax(300px,1.1fr);gap:14px}.details,.activity{display:grid;grid-template-rows:56px minmax(0,1fr)}.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}.empty{color:var(--muted);padding:20px}.details-body{padding:18px}.eyebrow{color:var(--blue);font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:750;margin-bottom:9px}.memory-title{font-size:17px;line-height:1.4;margin:0 0 12px;font-weight:630}.summary{color:#c7cee2;margin:12px 0 16px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tag{border:1px solid var(--border);background:rgba(255,255,255,.035);color:#aeb9d5;border-radius:10px;padding:3px 7px;font-size:10px}.time{color:var(--muted);font-size:10px}.json-toggle{border:0;background:transparent;color:var(--muted);padding:10px 0 5px;cursor:pointer;font-size:10px}pre{white-space:pre-wrap;word-break:break-word;margin:5px 0 0;padding:12px;background:rgba(3,6,15,.48);border:1px solid rgba(255,255,255,.055);border-radius:13px;color:#b9c5e4;font:10px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}.source{margin-top:10px;padding:10px 12px;border-radius:13px;background:rgba(121,169,255,.055);border:1px solid rgba(121,169,255,.12);color:#cbd4eb;font-size:11px}.source strong{color:#9fc2ff;display:block;margin-bottom:3px}
    .filters{margin-left:auto;display:flex;padding:3px;border-radius:11px;background:rgba(3,7,16,.38);border:1px solid rgba(255,255,255,.055)}.filters button{border:0;background:transparent;color:var(--muted);border-radius:8px;padding:5px 8px;font-size:10px;cursor:pointer}.filters button.selected{color:var(--text);background:rgba(255,255,255,.085);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}#feed{padding:7px 9px 12px}.event{position:relative;padding:10px 9px 10px 32px;border-radius:12px;cursor:pointer;transition:background .15s ease}.event:hover{background:rgba(255,255,255,.045)}.event:before{content:"";position:absolute;left:11px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(97,226,180,.3)}.event.read:before{background:var(--blue);box-shadow:0 0 10px rgba(121,169,255,.4)}.event.edge:before{background:var(--cyan)}.event.source:before{background:var(--amber)}.event+.event:after{content:"";position:absolute;left:14px;top:-5px;height:12px;width:1px;background:rgba(255,255,255,.1)}.event-top{display:flex;justify-content:space-between;gap:8px}.event-type{font-size:10px;font-weight:720;color:#cbd4ea}.event-time{color:#707d9f;font-size:9px;white-space:nowrap}.event-summary{font-size:11px;color:#9da9c5;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    @media(max-width:900px){body{overflow:auto}.shell{height:auto;min-height:100%;padding:10px}.subtitle,.hint{display:none}header{border-radius:17px}.header-actions select{max-width:150px}main{grid-template-columns:1fr}.graph-panel{height:560px}aside{grid-template-rows:360px 520px}.panel{border-radius:18px}}@media(max-width:560px){.search{display:none}.header-actions{gap:5px}.live{padding:7px}.brand-mark{width:30px;height:30px}.graph-panel{height:480px}.legend{gap:7px}.panel-head{padding:0 12px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="glass">
      <div class="brand"><div class="brand-mark"></div><div><h1>Memory Observer</h1><div class="subtitle">Meet Agent · memoria contextual</div></div></div>
      <div class="header-actions"><span id="connection" class="live">conectando</span><select id="workspace" aria-label="Workspace"><option value="">Todos los workspaces</option></select></div>
    </header>
    <main>
      <section class="panel glass graph-panel">
        <div class="panel-head"><h2>Grafo de memoria</h2><span id="node-count" class="count">0 memorias</span><div class="graph-tools"><input id="search" class="search" type="search" placeholder="Buscar memoria…"><button id="zoom-out" class="icon-btn" title="Alejar">−</button><button id="fit" class="icon-btn" title="Encuadrar">⌾</button><button id="zoom-in" class="icon-btn" title="Acercar">+</button></div></div>
        <div class="graph-wrap"><svg id="graph" role="img" aria-label="Grafo interactivo de memorias"><g id="viewport"></g></svg><div class="legend"><span><i class="dot" style="background:var(--green)"></i>Activa</span><span><i class="dot" style="background:var(--blue)"></i>Confirmada</span><span><i class="dot" style="background:var(--amber)"></i>Reemplazada</span></div><div class="hint">Scroll para zoom · arrastra para mover</div></div>
      </section>
      <aside>
        <section class="panel glass details"><div class="panel-head"><h2>Detalle</h2></div><div id="details" class="scroll empty">Selecciona un nodo o un evento para inspeccionarlo.</div></section>
        <section class="panel glass activity"><div class="panel-head"><h2>Actividad</h2><div class="filters"><button class="selected" data-filter="all">Todo</button><button data-filter="memory">Memorias</button><button data-filter="retrieved">Lecturas</button></div></div><div id="feed" class="scroll"></div></section>
      </aside>
    </main>
  </div>
  <script>
    const state={snapshot:{nodes:[],edges:[],sources:[],events:[],workspaces:[]},filter:'all',workspace:'',selected:null,stream:null,refreshTimer:null,positions:new Map(),transform:{x:0,y:0,k:1},drag:null};
    const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const short=(t,n=58)=>t&&t.length>n?t.slice(0,n-1)+'…':t||'sin contenido';
    const query=()=>state.workspace?'?workspaceId='+encodeURIComponent(state.workspace):'';
    async function load(){const r=await fetch('/memory-observer/api/snapshot'+query());if(!r.ok)throw new Error(await r.text());state.snapshot=await r.json();renderWorkspace();computeLayout();renderGraph();renderFeed();renderDetails()}
    function renderWorkspace(){const s=$('workspace'),v=state.workspace;s.innerHTML='<option value="">Todos los workspaces</option>'+state.snapshot.workspaces.map(w=>`<option value="${esc(w.id)}">${esc(w.name)}</option>`).join('');s.value=v}
    function seeded(node,i,n){let h=0;for(const c of node.id)h=(h*31+c.charCodeAt(0))|0;const groups=['decision','commitment','risk','dependency','requirement','milestone','change','document_reference'],hint=node.metadata?.semanticHint||'',found=groups.indexOf(hint),g=found>=0?found:Math.abs(h)%groups.length,col=g%4,row=Math.floor(g/4),gx=-270+col*180,gy=-110+row*220,a=(Math.abs(h)%6283)/1000,r=16+(Math.abs(h>>3)%48);return{x:gx+Math.cos(a)*r,y:gy+Math.sin(a)*r,vx:0,vy:0,gx,gy}}
    function computeLayout(){const nodes=state.snapshot.nodes,edges=state.snapshot.edges,positions=new Map(nodes.map((n,i)=>[n.id,state.positions.get(n.id)||seeded(n,i,nodes.length)]));const links=edges.map(e=>({a:positions.get(e.from_memory_id),b:positions.get(e.to_memory_id)})).filter(e=>e.a&&e.b);for(let tick=0;tick<240;tick++){const alpha=(1-tick/240)*.72+.04;for(let i=0;i<nodes.length;i++){const a=positions.get(nodes[i].id);for(let j=i+1;j<nodes.length;j++){const b=positions.get(nodes[j].id);let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy;if(d2<1){dx=.1;dy=.1;d2=.02}const f=Math.min(1.4,430/d2)*alpha;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f}}for(const l of links){const dx=l.b.x-l.a.x,dy=l.b.y-l.a.y,d=Math.max(1,Math.hypot(dx,dy)),f=(d-44)*.015*alpha;l.a.vx+=dx/d*f;l.a.vy+=dy/d*f;l.b.vx-=dx/d*f;l.b.vy-=dy/d*f}for(const p of positions.values()){p.vx+=(p.gx-p.x)*.052*alpha;p.vy+=(p.gy-p.y)*.052*alpha;p.vx*=.74;p.vy*=.74;p.x+=p.vx;p.y+=p.vy}}
      const values=[...positions.values()];if(values.length){const minX=Math.min(...values.map(p=>p.x)),maxX=Math.max(...values.map(p=>p.x)),minY=Math.min(...values.map(p=>p.y)),maxY=Math.max(...values.map(p=>p.y)),cx=(minX+maxX)/2,cy=(minY+maxY)/2,scale=Math.min(1,680/Math.max(1,maxX-minX),440/Math.max(1,maxY-minY));for(const p of values){p.x=(p.x-cx)*scale;p.y=(p.y-cy)*scale;p.vx=0;p.vy=0}}
      state.positions=positions;fitGraph(false)}
    function fitGraph(redraw=true){const values=[...state.positions.values()];if(!values.length)return;const svg=$('graph'),w=svg.clientWidth||800,h=svg.clientHeight||600,minX=Math.min(...values.map(p=>p.x)),maxX=Math.max(...values.map(p=>p.x)),minY=Math.min(...values.map(p=>p.y)),maxY=Math.max(...values.map(p=>p.y)),padding=52;state.transform.k=Math.min(1.35,(w-padding*2)/Math.max(1,maxX-minX),(h-padding*2)/Math.max(1,maxY-minY));state.transform.x=w/2-(minX+maxX)/2*state.transform.k;state.transform.y=h/2-(minY+maxY)/2*state.transform.k;if(redraw)applyTransform()}
    function applyTransform(){$('viewport').setAttribute('transform',`translate(${state.transform.x} ${state.transform.y}) scale(${state.transform.k})`)}
    function renderGraph(){const vp=$('viewport'),nodes=state.snapshot.nodes,edges=state.snapshot.edges,selected=state.selected?.kind==='node'?state.selected.id:null,term=$('search').value.trim().toLowerCase(),neighbors=new Set();if(selected){neighbors.add(selected);for(const e of edges){if(e.from_memory_id===selected)neighbors.add(e.to_memory_id);if(e.to_memory_id===selected)neighbors.add(e.from_memory_id)}}
      const edgeHtml=edges.map(e=>{const a=state.positions.get(e.from_memory_id),b=state.positions.get(e.to_memory_id);if(!a||!b)return'';const connected=selected&&(e.from_memory_id===selected||e.to_memory_id===selected),x=(a.x+b.x)/2,y=(a.y+b.y)/2;return`<line class="edge ${connected?'connected':''}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/><text class="edge-label ${connected?'visible':''}" x="${x}" y="${y-4}">${esc(e.relation_label)}</text>`}).join('');
      const nodeHtml=nodes.map(n=>{const p=state.positions.get(n.id),label=short(n.summary||n.content,38),match=!term||(n.content+' '+n.summary+' '+n.status).toLowerCase().includes(term),dim=!match||(selected&&!neighbors.has(n.id)),cls=[n.id===selected?'selected':'',dim?'dim':''].join(' ');return`<g class="node-group ${cls}" data-node="${n.id}" transform="translate(${p.x} ${p.y})"><circle class="node-halo" r="19"/><circle class="node ${esc(n.status)}" r="11.5"><title>${esc(n.content)}</title></circle><text class="node-label" y="-19">${esc(label)}</text></g>`}).join('');vp.innerHTML=edgeHtml+nodeHtml;applyTransform();$('node-count').textContent=`${nodes.length} memorias · ${edges.length} relaciones`;vp.querySelectorAll('[data-node]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();state.selected={kind:'node',id:el.dataset.node};renderGraph();renderDetails()}))}
    function eventSummary(e){const p=e.payload||{};if(e.eventType==='memory.retrieved')return`“${short(p.query,60)}” → ${p.resultCount??0} memorias`;const d=p.after||p.before||{};return short(d.summary||d.content||d.quoted_text||e.resourceId,70)}
    function visibleEvents(){return state.snapshot.events.filter(e=>state.filter==='all'||(state.filter==='retrieved'?e.eventType==='memory.retrieved':e.eventType.startsWith('memory.')||e.eventType.startsWith('edge.')||e.eventType.startsWith('source.')))}
    function renderFeed(){const events=visibleEvents();$('feed').innerHTML=events.length?events.map(e=>{const kind=e.eventType==='memory.retrieved'?'read':e.eventType.startsWith('edge.')?'edge':e.eventType.startsWith('source.')?'source':'';return`<div class="event ${kind}" data-event="${e.id}"><div class="event-top"><span class="event-type">${esc(e.eventType)}</span><span class="event-time">${new Date(e.occurredAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div><div class="event-summary">${esc(eventSummary(e))}</div></div>`}).join(''):'<div class="empty">Aún no hay actividad.</div>';$('feed').querySelectorAll('[data-event]').forEach(el=>el.addEventListener('click',()=>{state.selected={kind:'event',id:el.dataset.event};renderGraph();renderDetails()}))}
    function renderDetails(){const t=state.selected,d=$('details');if(!t){d.className='scroll empty';d.textContent='Selecciona un nodo o un evento para inspeccionarlo.';return}d.className='scroll details-body';if(t.kind==='node'){const n=state.snapshot.nodes.find(x=>x.id===t.id);if(!n)return;const sources=state.snapshot.sources.filter(s=>s.memory_id===n.id);d.innerHTML=`<div class="eyebrow">Memoria contextual</div><p class="memory-title">${esc(n.content)}</p><div class="meta"><span class="tag">${esc(n.status)}</span><span class="tag">confianza ${Number(n.confidence).toFixed(2)}</span><span class="tag">importancia ${Number(n.importance).toFixed(2)}</span></div><p class="summary">${esc(n.summary)}</p><div class="time">Actualizada ${esc(new Date(n.updated_at).toLocaleString())}</div><button class="json-toggle" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">Ver metadatos</button><pre hidden>${esc(JSON.stringify(n.metadata,null,2))}</pre>${sources.map(s=>`<div class="source"><strong>${esc(s.source_type)}</strong>${esc(s.quoted_text)}</div>`).join('')||'<div class="empty">Sin fuentes</div>'}`;return}const e=state.snapshot.events.find(x=>x.id===t.id);if(!e)return;d.innerHTML=`<div class="eyebrow">Evento de auditoría</div><p class="memory-title">${esc(e.eventType)}</p><div class="meta"><span class="tag">${esc(e.resourceType)}</span></div><div class="time">${esc(new Date(e.occurredAt).toLocaleString())}</div><pre>${esc(JSON.stringify(e.payload,null,2))}</pre>`}
    function startStream(){state.stream?.close();const s=new EventSource('/memory-observer/api/events'+query());state.stream=s;s.onopen=()=>{$('connection').textContent='en vivo'};s.onerror=()=>{$('connection').textContent='reconectando'};s.addEventListener('activity',m=>{const e=JSON.parse(m.data);state.snapshot.events.unshift(e);state.snapshot.events=state.snapshot.events.slice(0,250);renderFeed();clearTimeout(state.refreshTimer);state.refreshTimer=setTimeout(()=>load().catch(console.error),160)})}
    const svg=$('graph');svg.addEventListener('wheel',e=>{e.preventDefault();const rect=svg.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top,old=state.transform.k,next=Math.max(.25,Math.min(3,old*(e.deltaY<0?1.12:.89)));state.transform.x=mx-(mx-state.transform.x)*next/old;state.transform.y=my-(my-state.transform.y)*next/old;state.transform.k=next;applyTransform()},{passive:false});svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node-group'))return;state.drag={x:e.clientX,y:e.clientY,tx:state.transform.x,ty:state.transform.y};svg.setPointerCapture(e.pointerId);svg.classList.add('dragging')});svg.addEventListener('pointermove',e=>{if(!state.drag)return;state.transform.x=state.drag.tx+e.clientX-state.drag.x;state.transform.y=state.drag.ty+e.clientY-state.drag.y;applyTransform()});svg.addEventListener('pointerup',()=>{state.drag=null;svg.classList.remove('dragging')});
    $('zoom-in').onclick=()=>{state.transform.k=Math.min(3,state.transform.k*1.2);applyTransform()};$('zoom-out').onclick=()=>{state.transform.k=Math.max(.25,state.transform.k/1.2);applyTransform()};$('fit').onclick=()=>fitGraph();$('search').addEventListener('input',renderGraph);$('workspace').addEventListener('change',async e=>{state.workspace=e.target.value;state.selected=null;state.positions.clear();await load();startStream()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('selected',x===b));renderFeed()});window.addEventListener('resize',()=>fitGraph());load().then(startStream).catch(e=>{$('connection').textContent='error';$('details').textContent=e.message});
  </script>
</body>
</html>
